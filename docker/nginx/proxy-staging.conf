# ================================================
# HRMS Narwasthu Group - Staging Reverse Proxy Config
# ================================================

# Upstream definitions for Staging
upstream backend_staging_upstream {
    server hrms-backend-staging:80 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

upstream frontend_staging_upstream {
    server hrms-frontend-staging:3000 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Staging Entrypoint (port 80 inside container) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 64M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Environment "STAGING" always;

    # Health check for staging proxy
    location = /health {
        access_log off;
        return 200 '{"status":"staging_proxy_healthy","environment":"staging"}';
        add_header Content-Type application/json;
    }

    # Block cgi-bin
    location ^~ /cgi-bin/ {
        deny all;
        return 404;
    }

    # Route API requests to Staging Laravel backend
    location /api {
        proxy_pass http://backend_staging_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Route storage requests to Staging Laravel backend
    location /storage {
        proxy_pass http://backend_staging_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Static files caching for Next.js Staging
    location /_next/static/ {
        proxy_pass http://frontend_staging_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Everything else goes to Next.js Staging frontend
    location / {
        proxy_pass http://frontend_staging_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
