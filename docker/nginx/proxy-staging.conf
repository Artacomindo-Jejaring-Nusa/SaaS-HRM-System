# ================================================
# HRMS Narwasthu Group - Staging Reverse Proxy Config
# ================================================
# PENTING: Menggunakan Docker internal DNS resolver (127.0.0.11)
# dengan variable pada proxy_pass agar nginx SELALU me-resolve ulang
# DNS setiap request. Ini mencegah error 502/504 saat container
# di-rebuild dan mendapat IP baru.
# ================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Staging Entrypoint (port 80 inside container) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Docker internal DNS resolver — re-resolve setiap 10 detik
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 64M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Environment "STAGING" always;

    # Health check for staging proxy
    location = /health {
        access_log off;
        return 200 '{"status":"staging_proxy_healthy","environment":"staging"}';
        add_header Content-Type application/json;
    }

    # Block cgi-bin
    location ^~ /cgi-bin/ {
        deny all;
        return 404;
    }

    # Route API requests to Staging Laravel backend
    location /api {
        set $backend_api http://hrms-backend-staging:80;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Route storage requests to Staging Laravel backend
    location /storage {
        set $backend_storage http://hrms-backend-staging:80;
        proxy_pass $backend_storage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Route Reverb WebSocket requests for Staging
    location /app {
        set $backend_ws http://hrms-backend-staging:8080;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Route AI Face Recognition API requests to Staging AI Service
    location /ai/ {
        set $ai_service http://hrms-ai-face-staging:8001;
        proxy_pass $ai_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 10M;
    }

    # Static files caching for Next.js Staging
    location /_next/static/ {
        set $frontend_static http://hrms-frontend-staging:3000;
        proxy_pass $frontend_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Everything else goes to Next.js Staging frontend
    location / {
        set $frontend http://hrms-frontend-staging:3000;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

